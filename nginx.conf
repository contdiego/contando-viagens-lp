server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- compressao ----
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- HTML: sempre confere se mudou ----
    # sem isso o navegador inventa um prazo proprio e segura a pagina antiga por dias
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # ---- CSS e JS: cache longo, versionados por ?v= no index.html ----
    # ao alterar qualquer um deles, subir o numero da versao no index.html
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000" always;
        access_log off;
    }

    # ---- imagens e fontes: uma semana ----
    # ao trocar uma foto, usar nome de arquivo novo
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
